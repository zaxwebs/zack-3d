<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zack · Geometry Studio</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#11191e;color:#e8eeeb;font:14px system-ui}canvas{display:block}header{position:absolute;top:28px;left:32px;pointer-events:none}h1{margin:6px 0;font-size:28px;font-weight:500}small{color:#a4baa9;letter-spacing:2px;font-size:10px}p{color:#9daeb0;line-height:1.7}aside{position:absolute;right:24px;top:24px;width:252px;background:#182329ee;padding:22px;border:1px solid #344449;border-radius:14px}label{display:block;margin:17px 0;color:#cbd8d6;font-size:12px}input[type=range],select{width:100%;margin-top:9px}select,button{background:#25373b;color:#e8eeeb;border:1px solid #48605d;border-radius:6px;padding:9px}button{cursor:pointer}button:hover{background:#38554c}.row{display:flex;gap:8px;flex-wrap:wrap}footer{position:absolute;bottom:24px;left:32px;color:#82999b;font-size:12px}#error{color:#ffb2a6}@media(max-width:650px){aside{top:auto;bottom:45px;width:210px;padding:14px;right:12px}header{left:20px;top:16px}h1{font-size:22px}footer{left:20px;bottom:14px}}
  </style>
</head>
<body>
  <header><small>THREE.JS / NATIVE GEOMETRY</small><h1>Zack, reconstructed.</h1><p id="stats">Loading editable geometry…</p><p id="error"></p></header>
  <aside><small>MODEL INSPECTOR</small>
    <label>Pose</label>
    <div class="row"><button data-pose="down" aria-pressed="true">Hands down</button><button data-pose="front" aria-pressed="false">Hands front</button><button data-pose="hi" aria-pressed="false">Hi 👋</button><button data-pose="rest" aria-pressed="false">T-pose</button></div>
    <label>Surface<select id="surface"><option value="textured">Original texture</option><option value="clay">Clay geometry</option><option value="wire">Wireframe</option></select></label>
    <label><input id="rig" type="checkbox"> Show skeleton</label>
    <label><input id="gentle" type="checkbox" checked> Gentle poses</label>
    <label>Head turn <input id="head" type="range" min="-30" max="30" value="0"></label>
    <div class="row"><button id="reset">Reset model</button><button id="export">Export pose .json</button></div>
    <p>22,862 vertices · 10,712 triangles<br>78 bones · 4K texture</p>
  </aside>
  <style>button[aria-pressed=true]{background:#446b58;border-color:#87b59a;color:#fff}.row button[data-pose]{flex:1 1 42%}</style>
  <footer>Drag to orbit · Scroll to zoom · Right-drag to pan</footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
