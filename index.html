<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202020">
  <title>Zack · 3D Viewport</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:12px;color:#e6e6e6;background:#202020;--panel:#292929;--line:#414141;--accent:#e88b36}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#202020}button,input,select{font:inherit}button,select{color:inherit}button{cursor:pointer}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;width:100%;height:100%}
    .viewer{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0}
    #viewport{position:relative;min-width:0;min-height:0;overflow:hidden;background:#383838}#viewport canvas{display:block;width:100%;height:100%}
    .viewport-top{position:absolute;z-index:1;display:flex;align-items:center;gap:9px;color:#dedede;background:#202020d9;border:1px solid #484848;border-radius:3px;font-size:11px}
    .viewport-top{top:12px;left:12px;height:29px;padding:0 10px}.object-dot{width:7px;height:7px;border-radius:2px;background:var(--accent)}
    #error{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;color:#ffb4a8;font-size:12px}
    .properties{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border-left:1px solid #171717}
    .panel-title{height:40px;flex:0 0 40px;display:flex;align-items:center;padding:0 14px;color:#eee;font-size:12px;font-weight:600;background:#242424;border-bottom:1px solid #1d1d1d}
    .panel-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain}.section{border-bottom:1px solid #1b1b1b}
    .section-title{display:flex;align-items:center;min-height:34px;padding:0 13px;color:#e1e1e1;font-size:11px;font-weight:600;background:#303030;border-bottom:1px solid #242424}
    .section-content{padding:10px 12px 12px}.pose-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
    .pose-grid button,.action-row button{min-height:27px;padding:4px 8px;text-align:left;background:#3a3a3a;border:1px solid #202020;border-radius:3px;color:#dedede}
    .pose-grid button:hover,.action-row button:hover{background:#484848}.pose-grid button[aria-pressed="true"]{background:#654a32;border-color:#bd793b;box-shadow:inset 2px 0 var(--accent);color:#fff}
    .field{display:block;margin:0 0 11px}.field:last-child{margin-bottom:0}
    .field-label,.check-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px;color:#d3d3d3;font-size:11px}
    .field-label output{color:#bdbdbd;font-variant-numeric:tabular-nums}
    .texture-status{margin-top:8px;color:#aaa;font-size:10px;font-variant-numeric:tabular-nums}
    select,input[type="color"]{width:100%;height:27px;margin-top:4px;padding:3px 7px;background:#3a3a3a;border:1px solid #1c1c1c;border-radius:3px}
    select:focus-visible,button:focus-visible,input:focus-visible{outline:1px solid #f1a455;outline-offset:1px}
    input[type="range"]{width:100%;height:16px;margin:5px 0 0;accent-color:var(--accent)}input[type="color"]{padding:2px 4px}
    .check-row{justify-content:flex-start;cursor:pointer}.check-row input{margin:0 1px 0 0;accent-color:var(--accent)}
    .inline-check{display:flex;gap:14px;padding-top:4px}.action-row{display:flex;gap:6px}.action-row button{flex:1;text-align:center}
    @media(max-width:760px){.workspace{grid-template-columns:minmax(0,1fr) 270px}}
    @media(max-width:580px){.workspace{grid-template-columns:1fr;grid-template-rows:minmax(210px,54vh) minmax(0,1fr)}.properties{border-left:0;border-top:1px solid #171717}.panel-title{height:34px;flex-basis:34px}.panel-scroll{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}.section{border-right:1px solid #1b1b1b}.viewport-top{top:8px;left:8px}}
    #poseDescription{margin:9px 0 0;color:#b8b8b8;font-size:11px;line-height:1.5;min-height:33px}
    #animationDescription{margin:9px 0 0;color:#b8b8b8;font-size:11px;line-height:1.5;min-height:30px}
    .timeline{min-width:0;background:#242424;border-top:1px solid #111}
    .timeline-toolbar{display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 12px;border-bottom:1px solid #393939}
    .timeline-toolbar button{height:27px;padding:3px 10px;color:#eee;background:#3a3a3a;border:1px solid #505050;border-radius:3px}
    .timeline-toolbar button:hover:enabled{background:#484848}.timeline-toolbar button:disabled{opacity:.4;cursor:default}
    #timelinePlay{min-width:69px}#timelineName{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ccc}
    #timelineTime{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:11px;color:#bcbcbc}
    .timeline-zoom{display:flex;align-items:center;gap:4px}.timeline-zoom button{width:27px;padding:0;font-size:16px}
    .timeline-scroll{height:92px;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;scrollbar-color:#656565 #202020}
    .timeline-content{position:relative;height:76px;min-width:100%;--tick-step:24px}
    .timeline-ruler{position:absolute;inset:0 0 auto;height:29px;border-bottom:1px solid #414141;background:repeating-linear-gradient(to right,#525252 0 1px,transparent 1px var(--tick-step)) left bottom/100% 7px no-repeat;pointer-events:none}
    .timeline-tick{position:absolute;top:5px;padding-left:4px;color:#aaa;font-size:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .timeline-tick:last-child{transform:translateX(-100%);padding:0 4px 0 0}
    .timeline-clip{position:absolute;top:37px;left:1px;right:1px;height:29px;line-height:27px;padding:0 10px;overflow:hidden;white-space:nowrap;background:#4b3828;border:1px solid #78502d;border-radius:3px;color:#dab48e;pointer-events:none}
    .timeline[data-ready="false"] .timeline-clip{background:#2c2c2c;border-color:#414141;color:#888}
    #timelineScrubber{position:absolute;inset:0;width:100%;height:76px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:ew-resize}
    #timelineScrubber::-webkit-slider-runnable-track{height:76px;background:transparent}
    #timelineScrubber::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:3px;height:76px;background:var(--accent);border:0;border-radius:0;box-shadow:0 0 0 1px #19191966}
    #timelineScrubber::-moz-range-track{height:76px;background:transparent}#timelineScrubber::-moz-range-thumb{width:3px;height:76px;background:var(--accent);border:0;border-radius:0}
    #timelineScrubber:disabled{opacity:0;cursor:default}#timelineScrubber:focus-visible{outline-offset:-2px}
    @media(max-width:580px){.timeline-toolbar{gap:6px;padding:6px 8px}#timelineName{font-size:11px}#timelineTime{font-size:10px}.timeline-zoom{gap:2px}}
  </style>
</head>
<body>
  <div class="workspace">
    <div class="viewer">
    <main id="viewport" aria-label="3D viewport">
      <div class="viewport-top"><span class="object-dot" aria-hidden="true"></span><span>Zack</span></div>
      <div id="error" role="status" aria-live="polite"></div>
    </main>
    <section id="timeline" class="timeline" data-ready="false" aria-label="Animation timeline">
      <div class="timeline-toolbar">
        <button id="timelinePlay" type="button" aria-label="Play animation" title="Play / pause (Space)" disabled>▶ Play</button>
        <span id="timelineName">Select an animation</span>
        <output id="timelineTime" aria-label="Playback time">0.00 / 0.00 s</output>
        <div class="timeline-zoom" role="group" aria-label="Timeline zoom">
          <button id="timelineZoomOut" type="button" aria-label="Zoom out timeline" disabled>−</button>
          <button id="timelineZoomIn" type="button" aria-label="Zoom in timeline" disabled>+</button>
        </div>
      </div>
      <div id="timelineScroll" class="timeline-scroll" role="region" aria-label="Scrollable animation timeline" tabindex="0">
        <div id="timelineContent" class="timeline-content">
          <div id="timelineRuler" class="timeline-ruler" aria-hidden="true"></div>
          <div id="timelineClip" class="timeline-clip" aria-hidden="true">Choose a mocap preset to scrub its motion</div>
          <input id="timelineScrubber" type="range" min="0" max="0" step="any" value="0" aria-label="Animation time" disabled>
        </div>
      </div>
    </section>
    </div>
    <aside class="properties" aria-label="Model properties">
      <div class="panel-title">Properties</div>
      <div class="panel-scroll">
        <section class="section">
          <div class="section-title">Pose</div>
          <div class="section-content">
            <div id="poses" class="pose-grid" role="group" aria-label="Pose presets"></div>
            <p id="poseDescription" role="status" aria-live="polite"></p>
          </div>
        </section>
        <section class="section">
          <div class="section-title">Mocap animation</div>
          <div class="section-content">
            <div id="animations" class="pose-grid" role="group" aria-label="Animation presets"></div>
            <p id="animationDescription" role="status" aria-live="polite"></p>
          </div>
        </section>
        <section class="section">
          <div class="section-title">Texture resolution</div>
          <div class="section-content">
            <div class="pose-grid" role="group" aria-label="Texture resolution">
              <button type="button" data-texture-size="1024" aria-label="1024 by 1024 texture" aria-pressed="false">1K</button>
              <button type="button" data-texture-size="2048" aria-label="2048 by 2048 texture" aria-pressed="false">2K</button>
            </div>
            <div id="textureStatus" class="texture-status" role="status" aria-live="polite"></div>
          </div>
        </section>
        <section class="section">
          <div class="section-title">Model</div>
          <div class="section-content">
            <label class="field" for="surface"><span class="field-label">Surface</span>
              <select id="surface"><option value="textured">Textured</option><option value="clay">Clay</option><option value="wire">Wireframe</option></select>
            </label>
            <label class="check-row"><input id="rig" type="checkbox"> Skeleton</label>
            <label class="check-row"><input id="ground" type="checkbox"> Ground grid</label>
            <label class="field" for="head" style="margin-top:10px"><span class="field-label">Head turn <output id="headValue">0°</output></span>
              <input id="head" type="range" min="-30" max="30" value="0">
            </label>
          </div>
        </section>
        <section class="section">
          <div class="section-title">Actions</div>
          <div class="section-content action-row"><button id="reset" type="button">Reset pose</button><button id="export" type="button">Export JSON</button></div>
        </section>
      </div>
    </aside>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
